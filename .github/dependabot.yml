# Atualizações de dependências agrupadas: no máximo 1 PR por mês por ecossistema
# (alertas de segurança continuam chegando na hora, separados).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      dependencias:
        patterns: ["*"]
    ignore:
      # Os tipos do Node precisam acompanhar o Node de produção (node:22 no Dockerfile e no CI).
      # Versão maior só junto com a troca do Node; correções da 22.x continuam vindo.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
